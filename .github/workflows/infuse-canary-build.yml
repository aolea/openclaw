name: Infuse custom canary build and qualification

on:
  push:
    branches:
      - codex/v2026.10.2-infuse-canary-build

permissions:
  contents: read

concurrency:
  group: infuse-v2026.10.2-canary-build
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  qualify:
    if: github.repository == 'aolea/openclaw' && github.event.repository.private == false && github.ref == 'refs/heads/codex/v2026.10.2-infuse-canary-build'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout reviewed bootstrap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; exact stable source pin
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact frozen candidate and stable parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; exact stable source pin
        with:
          ref: 7494b64ee37d2cce1e9fd1873180eb35ea75f9e9
          path: candidate-source
          persist-credentials: false
          fetch-depth: 2

      - name: Qualify only inside secretless Docker
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I ci/infuse-canary/run-host.py --source "${GITHUB_WORKSPACE}/candidate-source"

      - name: Retain temporary sanitized build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7; exact stable source pin
        with:
          name: infuse-canary-7494b64ee3-${{ github.run_id }}-${{ github.run_attempt }}
          path: canary-artifacts/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
