name: Studio restart reload proof

on:
  push:
    branches:
      - codex/restart-reload-proof

permissions:
  contents: read

jobs:
  restart-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed subject
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: c63b72f1b679cf0b0657ac4e58bb2bd6314c6812
          fetch-depth: 2
          persist-credentials: false
      - name: Verify immutable source
        run: test "$(git rev-parse HEAD)" = c63b72f1b679cf0b0657ac4e58bb2bd6314c6812
      - name: Setup pinned Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
      - name: Verify production equality with the completed full build
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 0e4c54255f140e3cdefc998814c44cf4bf4611df -- . ':(exclude)**/*.test.ts'
      - name: Prove the exact repaired cancellation boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/studio-restart-proof
          node scripts/run-vitest.mjs src/infra/restart.reload-boundary.test.ts \
            2>&1 | tee .artifacts/studio-restart-proof/after-boundary.log
      - name: Prove repaired and real owning behavior
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code c63b72f1b679cf0b0657ac4e58bb2bd6314c6812
          node scripts/run-vitest.mjs \
            src/infra/restart-suspension.test.ts \
            src/infra/restart.deferral-timeout.test.ts \
            src/gateway/server-reload-handlers.test.ts \
            src/gateway/server-methods/system-agent-reset-boundary.test.ts \
            src/gateway/server-methods/chat-history-omission-request.test.ts \
            src/cli/gateway-cli/run-loop.test.ts \
            2>&1 | tee .artifacts/studio-restart-proof/after.log
      - name: Retain regression proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: studio-restart-regression-c63b72f1
          path: .artifacts/studio-restart-proof
          if-no-files-found: error
          retention-days: 14
