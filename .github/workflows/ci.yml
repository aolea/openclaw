name: Infuse custom canary build and qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infuse-v2026.11.1-infuse-19818bb59a-${{ github.sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  qualify:
    if: github.repository == 'aolea/openclaw' && github.event.repository.private == false && github.ref == 'refs/heads/codex/v2026.11.1-infuse-canary-build'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout reviewed bootstrap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout exact frozen candidate and stable base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 19818bb59a7bf9d4e9989fb9a4df6f1b4ffe8ca6
          path: candidate-source
          persist-credentials: false
          fetch-depth: 5
      - name: Qualify only inside secretless Docker
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I ci/infuse-canary/run-host.py --source "${GITHUB_WORKSPACE}/candidate-source"
      - name: Retain temporary sanitized build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: infuse-canary-19818bb59a-${{ github.run_id }}-${{ github.run_attempt }}
          path: canary-artifacts/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
