name: Studio restart reload proof

on:
  push:
    branches:
      - codex/restart-reload-proof

permissions:
  contents: read

jobs:
  restart-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed subject
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: c0a029fc3ea5128993335dd81f862825c77497bd
          fetch-depth: 2
          persist-credentials: false
      - name: Verify immutable source
        run: test "$(git rev-parse HEAD)" = c0a029fc3ea5128993335dd81f862825c77497bd
      - name: Setup pinned Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
      - name: Prove unchanged production and full-tree deadcode policy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/studio-restart-proof
          pnpm deadcode:full 2>&1 | tee .artifacts/studio-restart-proof/deadcode.log
      - name: Prove the exact repaired cancellation boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/studio-restart-proof
          node scripts/run-vitest.mjs src/infra/restart.reload-boundary.test.ts \
            2>&1 | tee .artifacts/studio-restart-proof/after-boundary.log
      - name: Prove unchanged runtime and static architecture policy
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:architecture 2>&1 | tee .artifacts/studio-restart-proof/architecture.log
      - name: Prove repaired and real owning behavior
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code c0a029fc3ea5128993335dd81f862825c77497bd
          node scripts/run-vitest.mjs \
            src/infra/restart-suspension.test.ts \
            src/infra/restart.deferral-timeout.test.ts \
            src/gateway/server-reload-handlers.test.ts \
            src/gateway/server-reload-handlers.hot-reload-status.test.ts \
            src/gateway/server-import-boundary.test.ts \
            src/gateway/server-methods/system-agent-reset-boundary.test.ts \
            src/gateway/server-methods/chat-history-omission-request.test.ts \
            src/agents/mcp-connection-resolver.test.ts \
            src/cli/gateway-cli/lifecycle-import-boundary.test.ts \
            src/cli/gateway-cli/run-loop.test.ts \
            2>&1 | tee .artifacts/studio-restart-proof/after.log
      - name: Build exact repaired production source
        shell: bash
        run: |
          set -euo pipefail
          pnpm build 2>&1 | tee .artifacts/studio-restart-proof/full-build.log
          if grep -n 'INEFFECTIVE_DYNAMIC_IMPORT' .artifacts/studio-restart-proof/full-build.log; then
            echo 'Unexpected ineffective dynamic import warning' >&2
            exit 1
          fi
          git diff --exit-code c0a029fc3ea5128993335dd81f862825c77497bd
      - name: Retain regression proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: studio-restart-regression-c0a029fc
          path: .artifacts/studio-restart-proof
          if-no-files-found: error
          retention-days: 14
